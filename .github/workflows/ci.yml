name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  linux-core:
    name: Linux core tests and Windows cross-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore TaskTracker.sln -p:EnableWindowsTargeting=true
      - run: dotnet test tests/TaskTracker.Domain.Tests/TaskTracker.Domain.Tests.csproj -c Release --no-restore --logger trx --results-directory TestResults
      - run: dotnet test tests/TaskTracker.Application.Tests/TaskTracker.Application.Tests.csproj -c Release --no-restore --logger trx --results-directory TestResults
      - run: dotnet test tests/TaskTracker.Windows.Tests/TaskTracker.Windows.Tests.csproj -c Release --no-restore --logger trx --results-directory TestResults
      - run: dotnet test tests/TaskTracker.Infrastructure.Tests/TaskTracker.Infrastructure.Tests.csproj -c Release --no-restore --logger trx --results-directory TestResults
      - run: dotnet build src/TaskTracker.Windows/TaskTracker.Windows.csproj -c Release --no-restore -p:EnableWindowsTargeting=true -p:AppxGeneratePriEnabled=false
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-linux
          path: TestResults

  windows-full:
    name: Windows full build, tests and publish
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore TaskTracker.sln
      - run: dotnet build TaskTracker.sln -c Release --no-restore
      - run: dotnet test TaskTracker.sln -c Release --no-build --blame-hang-timeout 2m --logger trx --results-directory TestResults
      - run: dotnet publish src/TaskTracker.Windows/TaskTracker.Windows.csproj -c Release -p:PublishProfile=win-x64 -p:PublishDir=${{ github.workspace }}\artifacts\publish\win-x64\
      - uses: actions/upload-artifact@v7
        with:
          name: TaskTracker-win-x64
          path: artifacts/publish/win-x64
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-windows
          path: TestResults
      - name: Install Inno Setup 6.7.3
        if: startsWith(github.ref, 'refs/tags/v')
        run: choco install innosetup --version=6.7.3 -y
      - name: Build Setup.exe
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DPublishDir=${{ github.workspace }}\artifacts\publish\win-x64" "/DAppVersion=$version" installer\TaskTracker.iss
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: TaskTracker-Setup
          path: artifacts/installer/*.exe
